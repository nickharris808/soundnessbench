[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soundnessbench"
version = "0.1.0"
description = "A public benchmark for guard-soundness tools, with brute-force ground truth."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["benchmark", "formal-methods", "verification", "security", "leaderboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
stack = ["certkit>=0.1.0", "exploit-counter>=0.1.0"]

[project.scripts]
soundnessbench = "soundnessbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soundnessbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
