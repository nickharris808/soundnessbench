[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soundnessbench"
version = "0.3.0"
description = "A public benchmark for guard-soundness tools, with brute-force ground truth."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["benchmark", "formal-methods", "verification", "security", "leaderboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Direct references: these are not on PyPI, so plain specifiers would make
# `pip install "soundnessbench[stack]"` fail for anyone who is not us. Swap to
# plain specifiers when publishing to PyPI, which rejects direct references.
stack = [
  "certkit @ git+https://github.com/nickharris808/certkit@main",
  "exploit-counter @ git+https://github.com/nickharris808/exploit-counter@main",
]

[project.scripts]
soundnessbench = "soundnessbench.cli:main"

[tool.hatch.metadata]
# Required by hatchling to permit the "name @ git+https://..." dependencies
# above. Those exist because the siblings are not on PyPI yet.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/soundnessbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
